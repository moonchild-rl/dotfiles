[theme]
name = "fzf-soft"
parent = "default"

[colors]
# Normal command rows: slightly dimmer than pure white.
Base = "#B8C0CC"

# Current selection in Atuin's TUI.
# Atuin currently uses AlertError for this.
AlertError = "#FFFFFF"

# Info/time-ish text.
AlertInfo = "#81A1C1"

# Warnings.
AlertWarn = "#D7BA7D"

# Important/title accents.
Important = "#E5E9F0"
Title = "#E5E9F0"

# Preview/support/help text.
Annotation = "#7E8490"
Guidance = "#7E8490"
Muted = "#7E8490"
