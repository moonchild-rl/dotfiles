# This tries to replicate powerlevel10k with rounded corners
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[\uE0B6](#DDDDDD)\
$os\
[\uE0B4](fg:#DDDDDD bg:#0D73CC)\
$directory\
${custom.git_clean_left}\
${custom.git_clean}\
${custom.git_clean_right}\
${custom.git_dirty_left}\
${custom.git_dirty}\
${custom.git_dirty_right}\
${custom.no_git_right}\
"""

right_format = """
$status\
$cmd_duration\
$jobs\
$direnv\
${custom.virtualenv}\
$conda\
${custom.container_project}\
$username\
$hostname\
$sudo\
$shlvl\
${env_var.yazi_level}\
${custom.vim_shell}\
${custom.toolbox}\
"""

[os]
disabled = false
style = "fg:#111111 bg:#DDDDDD"
format = '[ $symbol ]($style)'

[os.symbols]
Fedora = ""
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Alpine = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[directory]
style = "fg:#FFFFFF bg:#0D73CC"
format = "[  ](fg:#FFFFFF bg:#0D73CC)[$path ](bold fg:#FFFFFF bg:#0D73CC)"
home_symbol = "~"
truncation_length = 4
truncation_symbol = "⋯/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = ""
"Pictures" = ""
"Projects" = "󰲋"
"Coding" = "󰲋"

# Directory blue -> Git green, only in clean Git repos.
[custom.git_clean_left]
when = 'test "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = true && git diff --quiet --ignore-submodules --cached -- && git diff --quiet --ignore-submodules -- && test -z "$(git ls-files --others --exclude-standard)"'
command = 'true'
style = "fg:#0D73CC bg:#19CB00"
format = "[\uE0B4]($style)"
disabled = false

[custom.git_clean]
when = 'test "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = true && git diff --quiet --ignore-submodules --cached -- && git diff --quiet --ignore-submodules -- && test -z "$(git ls-files --others --exclude-standard)"'
command = """
branch="$(git branch --show-current 2>/dev/null)"
if [ -z "$branch" ]; then branch="$(git describe --tags --exact-match 2>/dev/null)"; fi
if [ -z "$branch" ]; then branch="$(git rev-parse --short HEAD 2>/dev/null)"; fi

ahead_behind=""
if git rev-parse --abbrev-ref --symbolic-full-name "@{upstream}" >/dev/null 2>&1; then
  set -- $(git rev-list --left-right --count "@{upstream}...HEAD" 2>/dev/null)
  behind="${1:-0}"
  ahead="${2:-0}"

  if [ "$ahead" -gt 0 ] && [ "$behind" -gt 0 ]; then
    ahead_behind=" ⇕⇡${ahead}⇣${behind}"
  elif [ "$ahead" -gt 0 ]; then
    ahead_behind=" ⇡${ahead}"
  elif [ "$behind" -gt 0 ]; then
    ahead_behind=" ⇣${behind}"
  fi
fi

printf " %s%s" "$branch" "$ahead_behind"
"""
style = "fg:#111111 bg:#19CB00"
format = "[ $output ]($style)"
disabled = false

[custom.git_clean_right]
when = 'test "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = true && git diff --quiet --ignore-submodules --cached -- && git diff --quiet --ignore-submodules -- && test -z "$(git ls-files --others --exclude-standard)"'
command = 'true'
style = "fg:#19CB00"
format = "[\uE0B4]($style) "
disabled = false

# Directory blue -> Git yellow, only in dirty Git repos.
[custom.git_dirty_left]
when = 'test "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = true && { ! git diff --quiet --ignore-submodules --cached -- || ! git diff --quiet --ignore-submodules -- || test -n "$(git ls-files --others --exclude-standard)"; }'
command = 'true'
style = "fg:#0D73CC bg:#CECB00"
format = "[\uE0B4]($style)"
disabled = false

[custom.git_dirty]
when = 'test "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = true && { ! git diff --quiet --ignore-submodules --cached -- || ! git diff --quiet --ignore-submodules -- || test -n "$(git ls-files --others --exclude-standard)"; }'
command = """
branch="$(git branch --show-current 2>/dev/null)"
if [ -z "$branch" ]; then branch="$(git describe --tags --exact-match 2>/dev/null)"; fi
if [ -z "$branch" ]; then branch="$(git rev-parse --short HEAD 2>/dev/null)"; fi

ahead_behind=""
if git rev-parse --abbrev-ref --symbolic-full-name "@{upstream}" >/dev/null 2>&1; then
  set -- $(git rev-list --left-right --count "@{upstream}...HEAD" 2>/dev/null)
  behind="${1:-0}"
  ahead="${2:-0}"

  if [ "$ahead" -gt 0 ] && [ "$behind" -gt 0 ]; then
    ahead_behind=" ⇕⇡${ahead}⇣${behind}"
  elif [ "$ahead" -gt 0 ]; then
    ahead_behind=" ⇡${ahead}"
  elif [ "$behind" -gt 0 ]; then
    ahead_behind=" ⇣${behind}"
  fi
fi

staged="$(git diff --cached --name-only 2>/dev/null | wc -l | tr -d ' ')"
unstaged="$(git diff --name-only 2>/dev/null | wc -l | tr -d ' ')"
untracked="$(git ls-files --others --exclude-standard 2>/dev/null | wc -l | tr -d ' ')"

printf " %s%s" "$branch" "$ahead_behind"
if [ "${staged:-0}" -gt 0 ]; then printf " +%s" "$staged"; fi
if [ "${unstaged:-0}" -gt 0 ]; then printf " !%s" "$unstaged"; fi
if [ "${untracked:-0}" -gt 0 ]; then printf " ?%s" "$untracked"; fi
exit 0
"""
style = "fg:#111111 bg:#CECB00"
format = "[ $output]($style)"
disabled = false

[custom.git_dirty_right]
when = 'test "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = true && { ! git diff --quiet --ignore-submodules --cached -- || ! git diff --quiet --ignore-submodules -- || test -n "$(git ls-files --others --exclude-standard)"; }'
command = 'true'
style = "fg:#CECB00"
format = "[\uE0B4]($style) "
disabled = false

# Directory blue closing cap, only outside Git repos.
[custom.no_git_right]
when = 'test "$(git rev-parse --is-inside-work-tree 2>/dev/null)" != true'
command = 'true'
style = "fg:#0D73CC"
format = "[\uE0B4]($style) "
disabled = false

# Disabled in right_format but kept because i might want this again
[docker_context]
#symbol = "󰡨 " #bigger fish
symbol = " "
style = "fg:#FFFFFF bg:#0D73CC"
format = "[\uE0B6](fg:#0D73CC)[$symbol$context](fg:#FFFFFF bg:#0D73CC)[\uE0B4](fg:#0D73CC)"

[custom.container_project]
description = "Docker/Podman project indicator"
when = '''
dir="$PWD"
while [ "$dir" != "/" ]; do
  if [ -f "$dir/Dockerfile" ] ||
     [ -f "$dir/Containerfile" ] ||
     [ -f "$dir/compose.yaml" ] ||
     [ -f "$dir/compose.yml" ] ||
     [ -f "$dir/docker-compose.yaml" ] ||
     [ -f "$dir/docker-compose.yml" ] ||
     [ -f "$dir/podman-compose.yaml" ] ||
     [ -f "$dir/podman-compose.yml" ]; then
    exit 0
  fi
  dir="$(dirname "$dir")"
done
exit 1
'''
command = '''
dir="$PWD"
while [ "$dir" != "/" ]; do
  if [ -f "$dir/Dockerfile" ] ||
     [ -f "$dir/Containerfile" ] ||
     [ -f "$dir/compose.yaml" ] ||
     [ -f "$dir/compose.yml" ] ||
     [ -f "$dir/docker-compose.yaml" ] ||
     [ -f "$dir/docker-compose.yml" ] ||
     [ -f "$dir/podman-compose.yaml" ] ||
     [ -f "$dir/podman-compose.yml" ]; then
    printf "󰡨 %s" "$(basename "$dir")"
    exit 0
  fi
  dir="$(dirname "$dir")"
done
exit 1
'''
style = "fg:#FFFFFF bg:#0D73CC"
format = "[\uE0B6](fg:#0D73CC)[$output](fg:#FFFFFF bg:#0D73CC)[\uE0B4](fg:#0D73CC)"
disabled = false

[username]
disabled = false
show_always = false
style_user = "fg:#CECB00"
style_root = "fg:#ff0000"
format = "[$user]($style)"

[hostname]
disabled = false
ssh_only = true
style = "fg:#CECB00"
format = "[@$hostname]($style) "

[cmd_duration]
min_time = 3000
show_milliseconds = false
disabled = false
format = "[\uE0B6](fg:#CECB00)[ $duration  ](fg:#111111 bg:#CECB00)[\uE0B4](fg:#CECB00)"

[status]
disabled = false
format = '[$symbol$common_meaning$signal_name$maybe_int ]($style)'
symbol = '✘'
success_symbol = '✔'
success_style = 'bold green'
failure_style = 'bold red'
map_symbol = true

[jobs]
symbol = " "
style = "bold fg:#86BBD8"
format = "[ $symbol$number ]($style)"

[direnv]
disabled = false
symbol = "󱁿 "
style = "bold fg:#FCA17D"
format = "[ $symbol$loaded/$allowed ]($style)"

[conda]
symbol = " "
style = "bold fg:#86BBD8"
format = "[ $symbol$environment ]($style)"
ignore_base = true

[sudo]
disabled = false
symbol = "󰌆 "
style = "bold fg:#DA627D"
format = "[ $symbol ]($style)"

[shlvl]
disabled = false
threshold = 3
symbol = "↕ "
style = "bold fg:#FCA17D"
format = "[ $symbol$shlvl ]($style)"

[custom.virtualenv]
description = "Python virtual environment name only"
when = 'test -n "$VIRTUAL_ENV"'
command = 'basename "$VIRTUAL_ENV"'
symbol = " "
style = "bold fg:#86BBD8"
format = "[ $symbol$output ]($style)"
